[project]
name = "projet-data"
version = "0.1.0"
description = "Dashboard sur la vulnérabilité des personnes âgées par EPCI en France métropolitaine"
readme = "README.md"
authors = [
    { name = "Parrin Lilou", email = "lilou.parrin@edu.esiee.fr" },
    { name = "Graignac Noemie", email = "noemie.graignac@edu.esiee.fr" },
]
requires-python = ">=3.14"
dependencies = [
    "dash>=4.4.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[[tool.mypy.overrides]]
module = ["pandas.*", "plotly.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# Règles par défaut (E, F), plus le tri des imports (I), les pièges courants (B)
# et la modernisation de la syntaxe (UP).
select = ["E", "F", "I", "B", "UP"]
# La longueur des lignes est gérée par « ruff format » (88 caractères). Seuls quelques
# textes et commentaires, impossibles à couper, dépassent, sans aller au-delà de la
# limite de 100 vérifiée par pylint.
ignore = ["E501"]

[tool.uv]
# « uv sync » n'installe que les dépendances du dashboard. Les outils de développement
# s'installent à part, avec « uv sync --group dev ».
default-groups = []
